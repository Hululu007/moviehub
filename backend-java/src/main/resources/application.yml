server:
  # Render 只注入 PORT；保留 SERVER_PORT 兼容本地/其他平台
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: moviehub-source-server
  datasource:
    # TiDB Cloud Serverless 必须走 TLS；库需提前创建（TiDB 不允许 createDatabaseIfNotExist）
    # connectionTimeZone=Asia/Shanghai + forceConnectionTimeZoneToSession=true：把会话时区设为 +08:00，
    # 使 CURRENT_TIMESTAMP / NOW() 与 client 绑定参数的时区一致（TiDB 默认会话是 UTC）
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:moviehub}?useUnicode=true&characterEncoding=utf8&sslMode=${MYSQL_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true&connectTimeout=10000&socketTimeout=30000
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${MYSQL_POOL_SIZE:8}
      minimum-idle: 2
      connection-timeout: 10000
      validation-timeout: 5000
      max-lifetime: 600000
  sql:
    init:
      # 自定义 DatabaseInitializer 在启动后执行初始化，数据库暂时不可达时应用仍可启动并由 API 回退默认源
      mode: never

moviehub:
  # 运维后台登录。未配置 admin-password 时登录与写接口整体禁用，避免公开服务出现默认口令。
  admin-user: ${ADMIN_USER:admin}
  admin-password: ${ADMIN_PASSWORD:}
  # 会话有效期（小时），页面上有操作会自动续期
  admin-session-hours: ${ADMIN_SESSION_HOURS:12}
  auto-speed-test-cron: "0 */10 * * * *"
  # 允许跨域只读访问的前端来源，逗号分隔；* 表示全部
  allowed-origins: ${ALLOWED_ORIGINS:*}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
