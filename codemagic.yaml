workflows:
  android-workflow:
    name: Build MovieHub APK
    max_build_duration: 60
    # Android 构建不需要 macOS，Linux 实例便宜得多（$0.015/min vs $0.038–0.095/min）
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Prepare keystore and local.properties
        script: |
          cd android

          # 生成调试签名（对应 app/build.gradle.kts 中的 debugConfig）
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 指向 Codemagic 提供的 Android SDK
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

          # Secrets Gradle Plugin 需要 .env 文件存在
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Build Debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --no-configuration-cache

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - 1693415692@qq.com
        notify:
          success: true
          failure: true
