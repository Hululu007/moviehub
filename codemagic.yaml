workflows:
  android-workflow:
    name: Build MovieHub APK
    max_build_duration: 60
    # Android 构建不需要 macOS，Linux 实例更便宜。
    # 免费账号若提示实例不可用，把 instance_type 改成 linux。
    instance_type: linux_x2
    environment:
      java: 17
      groups:
        - supabase_s3          # 在 Codemagic 创建变量组，放入 S3_ENDPOINT 等
    scripts:
      - name: Prepare keystore and local.properties
        script: |
          cd android

          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Build Debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --no-configuration-cache
          ls -lh app/build/outputs/apk/debug/*.apk

      - name: Upload APK to Supabase S3
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          VERSION=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts | head -1)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' android/app/build.gradle.kts | head -1)
          OBJ="moviehub/moviehub-v${VERSION}-${CODE}.apk"

          python3 scripts/upload_apk_to_s3.py "$APK" "$OBJ" | tee /tmp/upload.log

          PUBLIC_URL=$(grep -oP 'PUBLIC_URL=\K.*' /tmp/upload.log)
          echo "===== APK 下载地址 ====="
          echo "$PUBLIC_URL"

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
      - /tmp/upload.log

    publishing:
      email:
        recipients:
          - 1693415692@qq.com
        notify:
          success: true
          failure: true
