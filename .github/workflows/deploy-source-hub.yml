name: Deploy Source Hub to GitHub Pages

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'sources.json'
      - 'source-hub/**'
      - '.github/workflows/deploy-source-hub.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync root sources.json into source-hub
        run: |
          if [ -f sources.json ]; then
            cp sources.json source-hub/sources.json
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './source-hub'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
